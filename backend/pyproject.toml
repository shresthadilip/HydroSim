[project]
name = "hydrosim-api"
version = "0.1.0"
description = "FastAPI backend for interactive river flood simulation & hydraulic modeling"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "shapely>=2.0.6",
    "pyproj>=3.7.0",
    "rasterio>=1.4.3",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
